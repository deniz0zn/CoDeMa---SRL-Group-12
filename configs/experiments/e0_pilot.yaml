# E0 pilot: every model on every task for 2k steps (seed 0).
# Checks that everything runs and measures the time per step (see analyze.py e0 report).
# Runs: 20 (indices 0-19). sbatch --array=0-19 --partition=gpu_a100 --cpus-per-task=18 --time=<from E0> train.slurm configs/experiments/e0_pilot.yaml

dataset: configs/dataset.yaml
training: configs/train.yaml
training_overrides:
  experiment: E0
  device: cuda
  steps: 2000
  batch_size: 2048
  microbatch_size: 2048
  num_workers: 4
  log_every: 100
  optimizer: {learning_rate: 0.0001, weight_decay: 0.0001, lr_warmup_steps: 500, clip_grad: 0.25}
  evaluation: {every: 1000, episodes: 2, seed: 500000, action_mode: mean}
  wandb: {mode: online}

runs:
  # Index 0
  - name: cdt
    model: configs/models/cdt.yaml
    dataset: configs/datasets/antrun.yaml
    model_overrides:
      model: {embedding_dropout: 0.1}
    training_overrides:
      seed: 0
      evaluation:
        targets:
        - [700.0, 10.0]
        - [750.0, 20.0]
        - [800.0, 40.0]

  # Index 1
  - name: cdt_light
    model: configs/models/cdt_light.yaml
    dataset: configs/datasets/antrun.yaml
    training_overrides:
