# E3: component ablations (w/o augmentation, w/o entropy, deterministic), 5 tasks x 3 seeds.
# The full models are the E1 runs with seeds 0-2.
# CDT runs of E3 (optional).
# Runs: 45 (indices 0-44). sbatch --array=0-44 --partition=gpu_a100 --cpus-per-task=18 --time=<from E0> train.slurm configs/experiments/e3_cdt.yaml

dataset: configs/dataset.yaml
training: configs/train.yaml
training_overrides:
  experiment: E3
  device: cuda
  steps: 100000
  batch_size: 2048
  microbatch_size: 2048
  num_workers: 4
  log_every: 100
  optimizer: {learning_rate: 0.0001, weight_decay: 0.0001, lr_warmup_steps: 500, clip_grad: 0.25}
  evaluation: {every: 5000, episodes: 5, seed: 500000, action_mode: mean}
  wandb: {mode: online}

runs:
  # Index 0
  - name: cdt_noaug
    model: configs/models/cdt.yaml
    dataset: configs/datasets/antrun.yaml
    model_overrides:
      model: {embedding_dropout: 0.1}
    dataset_overrides:
      sequence: {augment_percent: 0.0}
    training_overrides:
      seed: 0
      evaluation:
        targets:
        - [700.0, 10.0]
        - [750.0, 20.0]
        - [800.0, 40.0]

