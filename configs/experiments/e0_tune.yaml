        - [550.0, 40.0]

  # Index 4
  - name: cdmamba_lr1e-4
    model: configs/models/cdmamba.yaml
    dataset: configs/datasets/carcircle.yaml
    model_overrides:
      trainer: {learning_rate: 0.0001}
    training_overrides:
      seed: 0
      evaluation:
        targets:
        - [450.0, 10.0]
        - [500.0, 20.0]
        - [550.0, 40.0]

  # Index 5
