# E1: main comparison, 5 tasks x 5 seeds, 100k steps, batch 2048.
# Validation during training (5 episodes per target on validation seeds) gives the learning curves;
# the reported numbers come from e1_test.yaml (final model, test seeds).
# Runs: 75 (indices 0-74). sbatch --array=0-74 --partition=gpu_a100 --cpus-per-task=18 --time=<from E0> train.slurm configs/experiments/e1.yaml

dataset: configs/dataset.yaml
training: configs/train.yaml
training_overrides:
  experiment: E1
  device: cuda
  steps: 100000
  batch_size: 2048
  microbatch_size: 2048
  num_workers: 4
  log_every: 100
  optimizer: {learning_rate: 0.0001, weight_decay: 0.0001, lr_warmup_steps: 500, clip_grad: 0.25}
  evaluation: {every: 5000, episodes: 5, seed: 500000, action_mode: mean}
  wandb: {mode: online}

runs:
  # Index 0
  - name: cdt_light
    model: configs/models/cdt_light.yaml
    dataset: configs/datasets/antrun.yaml
    training_overrides:
