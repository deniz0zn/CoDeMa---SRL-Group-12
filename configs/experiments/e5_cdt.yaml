# E5: unrealistic reward targets, 8 targets in 0.5-1.3 x the dataset's best reward return, kappa = 10,
# on the E1 models and the E3 models without augmentation (Fig. 2).
# Final model (last.pt), 20 episodes per target on test seeds (1000000+), mean action.
# Optional CDT runs.
# Runs: 40 (indices 0-39). sbatch --array=0-39 eval.slurm configs/experiments/e5_cdt.yaml

experiment: E5
source: E1
evaluation: {episodes: 20, seed: 1000000, action_mode: mean}

runs:
