seed: 12
device: cuda
steps: 50000
batch_size: 2048
microbatch_size: 128
num_workers: 0
log_every: 100

optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_warmup_steps: 500
  clip_grad: 0.25

evaluation:
  every: 1000
  episodes: 10
  seed: 60000
  target_return: 575.0
  target_costs: [10.0, 20.0, 40.0]
  action_mode: sample

experiment: car_run_poc # name of the experiment shown in wandB

wandb:
  project: constrained-decision-models
  entity: null
  mode: online  # online, offline, or disabled