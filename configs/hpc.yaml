dataset: configs/dataset.yaml
training: configs/train.yaml

training_overrides:
  experiment: car_run_hpc
  device: cuda
  seed: 0
  steps: 100000
  batch_size: 64
  num_workers: 0
  log_every: 100

  evaluation:
    every: 5000
    episodes: 5
    seed: 123

runs:
  # Index 0: short GPU baseline
  - name: cdm_pilot
    model: configs/models/cdm.yaml
    training_overrides:
      steps: 1000
      evaluation:
        every: 500

  # Index 1
  - name: cdt
    model: configs/models/cdt.yaml

  # Index 2
  - name: cdt_small
    model: configs/models/cdt_small.yaml

  # Index 3
  - name: cdm
    model: configs/models/cdm.yaml

  # Index 4: example variant (we can construct models like this without a seperate yaml file)
  - name: cdm_small
    model: configs/models/cdm.yaml
    model_overrides:
      model:
        embedding_dim: 64
        num_layers: 2