dataset: configs/dataset.yaml
training: configs/train.yaml

training_overrides:
  experiment: car_run_diagnostic_10k
  device: cuda
  steps: 50000
  batch_size: 2048
  microbatch_size: 128
  num_workers: 0
  log_every: 100
  optimizer:
    learning_rate: 0.0001
    weight_decay: 0.0001
    lr_warmup_steps: 500
    clip_grad: 0.25
  evaluation:
    every: 1000
    episodes: 10
    seed: 60000
    target_return: 575.0
    target_costs: [10.0, 20.0, 40.0]
    action_mode: sample
  wandb:
    mode: online

runs:
  # Index 0
  - name: cdt
    model: configs/models/cdt.yaml
    training_overrides:
      seed: 12

  # Index 1
  - name: cdt
    model: configs/models/cdt.yaml
    training_overrides:
      seed: 0

  # Index 2
  - name: cdt
    model: configs/models/cdt.yaml
    training_overrides:
      seed: 1

  # Index 3
  - name: cdt_light
    model: configs/models/cdt_light.yaml
    training_overrides:
      seed: 12

  # Index 4
  - name: cdt_light
    model: configs/models/cdt_light.yaml
    training_overrides:
      seed: 0

  # Index 5
  - name: cdt_light
    model: configs/models/cdt_light.yaml
    training_overrides:
      seed: 1

  # Index 6
  - name: cdm
    model: configs/models/cdm.yaml
    training_overrides:
      seed: 12

  # Index 7
  - name: cdm
    model: configs/models/cdm.yaml
    training_overrides:
      seed: 0

  # Index 8
  - name: cdm
    model: configs/models/cdm.yaml
    training_overrides:
      seed: 1
