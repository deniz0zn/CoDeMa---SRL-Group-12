model_script: models.cdm_3

model:
  embedding_dim: 128
  num_layers: 3

  d_state: 32
  expand: 1
  headdim: 32
  is_mimo: true
  mimo_rank: 2
  chunk_size: 16

  use_mlp: true
  mlp_ratio: 2

  residual_dropout: 0.1
  embedding_dropout: 0.1

  time_emb: true
  use_rew: true
  use_cost: true
  cost_transform: true
  stochastic: true

trainer:
  loss_cost_weight: 0.02
  loss_state_weight: 0.0
