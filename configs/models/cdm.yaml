model_script: models.cdm_3

model:
  embedding_dim: 128
  num_layers: 3

  d_state: 128
  expand: 2
  headdim: 64
  is_mimo: true
  mimo_rank: 4
  chunk_size: 8

  residual_dropout: 0.1
  embedding_dropout: 0.1

  time_emb: true
  use_rew: true
  use_cost: true
  cost_transform: true
  stochastic: true

trainer:
  loss_cost_weight: 0.02
  loss_state_weight: 0.0