model_script: models.cdconv

model:
  embedding_dim: 128
  num_layers: 3
  conv_window: 2  # timesteps; kernel = 4 modalities x 2 = 8 tokens

  residual_dropout: 0.1
  embedding_dropout: 0.1

  time_emb: true
  use_rew: true
  use_cost: true
  cost_transform: true
  stochastic: true

trainer:
  loss_cost_weight: 0.02
  loss_state_weight: 0.0
