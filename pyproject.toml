[project]
name = "codema-srl"
version = "0.1.0"
description = "OSRL CDT baseline on DSRL CarRun"
requires-python = "==3.10.*"

dependencies = [
    "osrl-lib==0.1.0",
    "dsrl==0.1.0",
    "fast-safe-rl==0.1.0",
    "bullet-safety-gym==1.4.0",
    "gymnasium==0.28.1",
    "numpy==1.23.5",
    "scipy==1.10.1",
    "numba==0.57.1",
    "tianshou==0.5.1",
    "OApackage==2.7.6",
    "matplotlib==3.7.5",
    "tensorboard==2.11.2",
    "protobuf==3.19.6",
    "setuptools==65.5.1",
    "pyyaml==6.0.3",
    "wandb==0.22.3",
    "transformers==4.38.2",
    "torch==2.9.1",
    "mamba-ssm",
    "triton>=3.5.0",
    "quack-kernels==0.3.4",
    "optuna==4.5.0",
    "ninja",
    "wheel",
    "packaging",
    "apache-tvm-ffi==0.1.9",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'",]
override-dependencies = ["wandb==0.22.3","torch==2.9.1",]
no-build-isolation-package = ["mamba-ssm"]

[tool.uv.sources]
osrl-lib = { git = "https://github.com/liuzuxin/OSRL.git", rev = "03a4586463690566ec8d7830ca4027b46d4ad02f" }
dsrl = { git = "https://github.com/liuzuxin/DSRL.git", rev = "71064f21976f59c8f7139d00f1294963a1558369" }
mamba-ssm = { git = "https://github.com/state-spaces/mamba.git", rev = "e9594ce1c732d97440f0332fdc43170a2294dbfa" }
torch = { index = "pytorch-cu128" }


[tool.uv.extra-build-dependencies]
oapackage = [
    "numpy==1.23.5",
    "swig==4.1.1",
    "setuptools==65.5.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
analysis = [
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]
