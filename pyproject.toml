[project]
name = "codema-srl"
version = "0.1.0"
description = "OSRL CDT baseline on DSRL CarRun"
requires-python = "==3.10.*"

dependencies = [
    "osrl-lib==0.1.0",
    "dsrl==0.1.0",
    "fast-safe-rl==0.1.0",
    "bullet-safety-gym==1.4.0",
    "gymnasium==0.28.1",
    "torch==1.13.1",
    "numpy==1.23.5",
    "scipy==1.10.1",
    "numba==0.57.1",
    "tianshou==0.5.1",
    "OApackage==2.7.6",
    "matplotlib==3.7.5",
    "tensorboard==2.11.2",
    "protobuf==3.19.6",
    "setuptools==65.5.1",
    "pyyaml==6.0.3",
    "wandb==0.22.3",
    "mamba-ssm==1.2.0.post1",
    "causal-conv1d==1.2.0.post2",
    "triton==2.1.0",
    "transformers==4.30.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'",]
override-dependencies = ["wandb==0.22.3",]

[tool.uv.sources]
osrl-lib = { git = "https://github.com/liuzuxin/OSRL.git", rev = "03a4586463690566ec8d7830ca4027b46d4ad02f" }
dsrl = { git = "https://github.com/liuzuxin/DSRL.git", rev = "71064f21976f59c8f7139d00f1294963a1558369" }
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v1.2.0.post1/mamba_ssm-1.2.0.post1%2Bcu118torch1.13cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.2.0.post2/causal_conv1d-1.2.0.post2%2Bcu118torch1.13cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }

[tool.uv.extra-build-dependencies]
oapackage = [
    "numpy==1.23.5",
    "swig==4.1.1",
    "setuptools==65.5.1",
]

