model_name: cdm
task: OfflineCarCircle-v0
seed: 42
experiment: main
model:
  model:
    chunk_size: 16
    cost_transform: true
    d_state: 32
    embedding_dim: 128
    embedding_dropout: 0.1
    expand: 1
    headdim: 32
    is_mimo: true
    mimo_rank: 2
    mlp_ratio: 2
    num_layers: 3
    residual_dropout: 0.1
    stochastic: true
    time_emb: true
    use_cost: true
    use_mlp: true
    use_rew: true
  model_script: models.cdm_3
  trainer:
    loss_cost_weight: 0.02
    loss_state_weight: 0.0
dataset:
  evaluation:
    targets:
    - - 450.0
      - 10.0
    - - 500.0
      - 20.0
    - - 550.0
      - 50.0
  sampling_cost_offset: 70.0
  scales:
    cost_scale: 1.0
    reward_scale: 0.1
  sequence:
    augment_percent: 0.2
    beta: 1.0
    cost_sample: true
    deg: 4
    max_rew_decrease: 100.0
    max_reward: 600.0
    min_reward: 1.0
    seq_len: 10
  task: OfflineCarCircle-v0
training:
  batch_size: 2048
  device: cuda
  evaluation:
    action_mode: sample
    episodes: 10
    every: 2500
    seed: 60000
    target_costs:
    - 10.0
    - 20.0
    - 40.0
    target_return: 575.0
  experiment: main
  keep_step_checkpoints: false
  log_every: 100
  microbatch_size: 128
  num_workers: 0
  optimizer:
    clip_grad: 0.25
    learning_rate: 0.0001
    lr_warmup_steps: 500
    weight_decay: 0.0001
  seed: 42
  steps: 100000
  wandb:
    entity: null
    mode: online
    project: constrained-decision-models
